<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{background:#07050c;color:#f5f0ff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;}

.control{border:1px solid rgba(155,77,255,.25);background:rgba(255,255,255,.04);color:#ddd3ea;padding:7px 10px;border-radius:8px;cursor:pointer;}
.control:hover{border-color:rgba(155,77,255,.7);color:white;}
#gameContainer{position:absolute;top:58px;left:0;right:0;bottom:0;background:#000;}
#gameFrame{width:100%;height:100%;border:0;display:block;}
@media(max-width:650px){.game-name{display:none;}.control{padding:6px 7px;font-size:11px;}}
</style>
</head>
<body>
<header>
<div class="logo">
<div class="logo-icon">🎮</div>

</div>

<button class="control" id="blankButton" type="button">↗ About:blank</button>
<button class="control" id="libraryButton" type="button">← Library</button>
</div>

<main id="gameContainer">
<iframe id="gameFrame" allowfullscreen="" allow="accelerometer; autoplay; clipboard-read; clipboard-write; encrypted-media; fullscreen; gamepad; gyroscope; microphone; camera; midi; payment; picture-in-picture; screen-wake-lock; web-share" srcdoc="&lt;!DOCTYPE html&gt;


&lt;!-- Ultimate Game Stash file--&gt; 
&lt;!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ --&gt;



&lt;html lang=&quot;en-us&quot; style=&quot;height:100%; overflow:hidden&quot;&gt;
&lt;head&gt;
  &lt;base href=&quot;https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@79091a3feb921044b3597bd32cea7357b43e2d9c/indian-truck-simulator-3d-gh-pages/&quot;&gt;
  &lt;meta charset=&quot;utf-8&quot;&gt;
  &lt;meta http-equiv=&quot;Content-Type&quot; content=&quot;text/html; charset=utf-8&quot;&gt;
  &lt;title&gt;Unity WebGL Player | BlightBorne&lt;/title&gt;
  &lt;style&gt;
    * {
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
    }

    #gameContainer canvas {
      display:block;
    }

    div#webgl-content {
      position: absolute;
      top: 50%;
      left: 50%;
      -webkit-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    div#loadingBox {
      width: 100%;
      height: 0px;
      position: absolute;
      top: 50%;
      margin-top: 137px;
      text-align: center;
    }

    div#icon {
      width: 300px;
      height: 310px;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -185px;
      margin-left: -150px;
      background-image: url(&quot;Template/Blight-Borne.jpg&quot;);
      background-repeat: no-repeat;
      box-shadow: 1px 1px 5px #141414;
    }

    div#box {
      width: 328px;
      height: 367px;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -199px;
      margin-left: -164px;
      background: #222;
      box-shadow: 1px 1px 5px #000;
    }

    div#bgBar {
      display: none;
      position: absolute;
      width: 300px;
      margin-left: -150px;
      left: 50%;
      height: 18px;
      background-color: #882121;
      box-shadow: 1px 1px 5px #111;
    }

    div#progressBar {
      display: none;
      left: 50%;
      position: absolute;
      margin-left: -150px;
      width: 0px;
      height: 18px;
      background-color: #dc4241;
    }

    p#loadingInfo {
      color: #fff;
      letter-spacing: 1px;
      position: absolute;
      width: 100%;
      font-family: sans-serif;
      text-align: center;
      top: 50%;
      font-size: 11px;
      font-weight: 500;
      margin-top: 140px;
      text-shadow: 0px 0px 5px #000;
    }

    div#spinner {
      position: absolute;
      height: 18px;
      left: 50%;
      margin-left: -150px;
      width: 300px;
      position: relative;
      overflow: hidden;
      background-color: #882121;
      box-shadow: 1px 1px 5px #111;
    }

    div#spinner:before {
      display: block;
      position: absolute;
      content: &quot;&quot;;
      width: 150%;
      margin-left: -10px;
      height: 10px;
      background-color: #e85352;
      transform: rotate(-5deg);
      animation: loading 1s linear infinite;
    }

    @keyframes loading {
      from {
        top: -185%
      }
      to {
        top: 225%
      }
    }
  &lt;/style&gt;
 
  &lt;script src=&quot;Build/UnityLoader.js&quot;&gt;&lt;/script&gt;
  &lt;script&gt;
    window.mergedBlobUrls = {};

    function mergeFiles(fileParts) {
      return new Promise((resolve, reject) =&gt; {
        let buffers = [];
        function fetchPart(i) {
          if (i &gt;= fileParts.length) {
            let mergedBlob = new Blob(buffers);
            let mergedUrl = URL.createObjectURL(mergedBlob);
            resolve(mergedUrl);
            return;
          }
          fetch(fileParts[i])
            .then(r =&gt; r.arrayBuffer())
            .then(data =&gt; {
              buffers.push(data);
              fetchPart(i + 1);
            })
            .catch(reject);
        }
        fetchPart(0);
      });
    }

    function getParts(file, start, end) {
      let arr = [];
      for (let i = start; i &lt;= end; i++) {
        arr.push(file + &quot;.part&quot; + i);
      }
      return arr;
    }

    function resizeUnityContainer() {
      var container = document.getElementById(&quot;gameContainer&quot;);
      if (container) {
        container.style.width = window.innerWidth + &quot;px&quot;;
        container.style.height = window.innerHeight + &quot;px&quot;;
      }
    }

    window.addEventListener('resize', resizeUnityContainer);

    function UnityProgress(gameInstance, progress) {
      var container = document.getElementById(&quot;gameContainer&quot;);
      if (container) document.body.style.background = container.style.background;

      if (!gameInstance.Module) {
         return;
      } else if (progress === &quot;complete&quot;) {
        document.getElementById(&quot;loadingBox&quot;).style.display = &quot;none&quot;;
        document.getElementById(&quot;icon&quot;).style.display = &quot;none&quot;;
        document.getElementById(&quot;loadingInfo&quot;).style.display = &quot;none&quot;;
        document.getElementById(&quot;box&quot;).style.display = &quot;none&quot;;
      } else if (progress === 1 || progress === &quot;preinit&quot;) {
        document.getElementById(&quot;loadingInfo&quot;).innerHTML = &quot;PROCESSING...&quot;;
        document.getElementById(&quot;spinner&quot;).style.display = &quot;inherit&quot;;
        document.getElementById(&quot;bgBar&quot;).style.display = &quot;none&quot;;
        document.getElementById(&quot;progressBar&quot;).style.display = &quot;none&quot;;
      } else if (progress &gt; 0) {
        document.getElementById(&quot;progressBar&quot;).style.width = 300 * progress + &quot;px&quot;
        document.getElementById(&quot;loadingInfo&quot;).innerHTML = Math.round(progress * 100) + &quot;%&quot;;
        document.getElementById(&quot;spinner&quot;).style.display = &quot;none&quot;;
        document.getElementById(&quot;bgBar&quot;).style.display = &quot;block&quot;;
        document.getElementById(&quot;progressBar&quot;).style.display = &quot;inherit&quot;;
      }
    }

    (function() {
      var originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url, ...args) {
        for (let key in window.mergedBlobUrls) {
          if (url.includes(key)) {
            url = window.mergedBlobUrls[key];
            break;
          }
        }
        return originalOpen.call(this, method, url, ...args);
      };
    })();

    window.addEventListener(&quot;load&quot;, function () {
      fetch(&quot;Build/indian_truck_gd_2_0_1.json&quot;)
        .then(r =&gt; r.json())
        .then(config =&gt; {
          return Promise.all([
            mergeFiles(getParts(&quot;Build/indian_truck_gd_2_0_1.data.unityweb&quot;, 1, 2)),
            mergeFiles(getParts(&quot;Build/indian_truck_gd_2_0_1.wasm.code.unityweb&quot;, 1, 1)),
            mergeFiles(getParts(&quot;Build/indian_truck_gd_2_0_1.wasm.framework.unityweb&quot;, 1, 1))
          ]).then(([dataUrl, wasmCodeUrl, wasmFrameworkUrl]) =&gt; {
            window.mergedBlobUrls[&quot;indian_truck_gd_2_0_1.data.unityweb&quot;] = dataUrl;
            window.mergedBlobUrls[&quot;indian_truck_gd_2_0_1.wasm.code.unityweb&quot;] = wasmCodeUrl;
            window.mergedBlobUrls[&quot;indian_truck_gd_2_0_1.wasm.framework.unityweb&quot;] = wasmFrameworkUrl;

            config.dataUrl = &quot;Build/indian_truck_gd_2_0_1.data.unityweb&quot;;
            config.wasmCodeUrl = &quot;Build/indian_truck_gd_2_0_1.wasm.code.unityweb&quot;;
            config.wasmFrameworkUrl = &quot;Build/indian_truck_gd_2_0_1.wasm.framework.unityweb&quot;;

            let blob = new Blob([JSON.stringify(config)], { type: &quot;application/json&quot; });
            let blobUrl = URL.createObjectURL(blob);

            window.gameInstance = UnityLoader.instantiate(&quot;gameContainer&quot;, blobUrl, {
              onProgress: UnityProgress,
              Module: {
                onRuntimeInitialized: function () {
                  resizeUnityContainer();
                  UnityProgress(window.gameInstance, 'complete');
                },
                preInit: [function() { UnityProgress(window.gameInstance, &quot;preinit&quot;); }]
              }
            });
          });
        })
        .catch(err =&gt; {
          console.error(&quot;Unity load failed:&quot;, err);
          var loadingInfo = document.getElementById(&quot;loadingInfo&quot;);
          if (loadingInfo) {
            loadingInfo.innerHTML = &quot;ERROR LOADING GAME - Check console&quot;;
          }
        });
    });
  &lt;/script&gt;
&lt;/head&gt;
&lt;body style=&quot;width:100%; height:100%; margin:0; overflow:hidden&quot;&gt;
  &lt;div id=&quot;webgl-content&quot; style=&quot;width:100%; height: 100%&quot;&gt;
    &lt;div id=&quot;gameContainer&quot; style=&quot;width: 100%; height: 100%&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div id=&quot;box&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;loadingBox&quot;&gt;
    &lt;div id=&quot;spinner&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;bgBar&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;progressBar&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div id=&quot;icon&quot;&gt;&lt;/div&gt;
  &lt;p id=&quot;loadingInfo&quot;&gt;&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
</main>
<script>
var frame=document.getElementById("gameFrame");
document.getElementById("fullscreenButton").addEventListener("click",function(){if(frame.requestFullscreen){frame.requestFullscreen();}});
document.getElementById("blankButton").addEventListener("click",function(){var w=window.open("about:blank","_blank");if(!w){alert("Please allow popups for Voidware.");return;}w.document.open();w.document.write(document.documentElement.outerHTML);w.document.close();});
document.getElementById("libraryButton").addEventListener("click",function(){window.location.href="index.html";});
</script>
</body>
</html>
