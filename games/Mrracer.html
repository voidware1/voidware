<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr Racer — Voidware</title>
<meta name="game-title" content="Mr Racer">
<meta name="theme-color" content="#080510">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{background:#07050c;color:#f5f0ff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:rgba(7,5,12,.94);border-bottom:1px solid rgba(155,77,255,.2);}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:2px;}
.logo-icon{width:31px;height:31px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(135deg,#9b4dff,#5f20b8);}
.game-name{color:#cfc4db;font-size:13px;max-width:30vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.controls{display:flex;gap:7px;}
.control{border:1px solid rgba(155,77,255,.25);background:rgba(255,255,255,.04);color:#ddd3ea;padding:7px 10px;border-radius:8px;cursor:pointer;}
.control:hover{border-color:rgba(155,77,255,.7);color:white;}
#gameContainer{position:absolute;top:58px;left:0;right:0;bottom:0;background:#000;}
#gameFrame{width:100%;height:100%;border:0;display:block;}
@media(max-width:650px){.game-name{display:none;}.control{padding:6px 7px;font-size:11px;}}
</style>
</head>
<body>
<header>
<div class="logo">
<div class="logo-icon">🎮</div>
<div class="game-name">Mr Racer</div>
</div>
<div class="controls">
<button class="control" id="fullscreenButton" type="button">⛶ Fullscreen</button>
<button class="control" id="blankButton" type="button">↗ About:blank</button>
<button class="control" id="libraryButton" type="button">← Library</button>
</div>
</header>

&lt;html lang=&quot;en-us&quot;&gt;
    &lt;head&gt;
        &lt;base href = &quot;https://cdn.jsdelivr.net/gh/cooldude2349/everything@main/mrracerrr/&quot;&gt;
        &lt;link rel=&quot;manifest&quot; href=&quot;./manifest.json&quot;&gt;
        &lt;meta charset=&quot;utf-8&quot;&gt;
        &lt;meta http-equiv=&quot;Content-Type&quot; content=&quot;text/html; charset=utf-8&quot;&gt;

        &lt;style&gt;

            &lt;img id=&quot;icon&quot; src=&quot;./icon.png&quot; /&gt;

            let loadingOverlay = document.getElementById('loading-overlay')

            let bannerContainer = document.getElementById('banner-container')

            // utils
            window.unityInstance = null
            let progressBarFillingInterval = null
            let progressBarCompleteFillingStarted = false

            function sendMessageToUnity(name, value) {
                if (window.unityInstance !== null) {
                    window.unityInstance.SendMessage('PlaygamaBridge', name, value)
                }
            }

            function onUnityLoadingProgressChanged(progress) {
                if (progress &gt;= 1 &amp;&amp; progressBarFillingInterval !== null) {
                    clearInterval(progressBarFillingInterval)
                    progressBarFillingInterval = null
                    return
                }

                if (progressBarCompleteFillingStarted) {
                    return
                }

                if (progress &gt;= 0.9) {
                    progressBarCompleteFillingStarted = true
                    completeProgressBarFilling()
                    return
                }

                progressBarFill.style.width = `${ progress * 100 }%`
            }
            
            function completeProgressBarFilling() {
                if (progressBarFillingInterval !== null) {
                    return
                }

                let currentPercent = 90
                progressBarFill.style.width = `${ currentPercent }%`
                progressBarFillingInterval = setInterval(() =&gt; {
                    currentPercent++
                    if (currentPercent &gt; 100) {
                        currentPercent = 100
                    }

                    progressBarFill.style.width = `${ currentPercent }%`

                    if (currentPercent &gt;= 100) {
                        clearInterval(progressBarFillingInterval)
                        progressBarFillingInterval = null
                        return
                    }
                }, 100)
            }

            window.addEventListener('pointerdown', () =&gt; {
                window.focus()
                canvas.focus()
            })


            let bridgeOptions = {
                platforms: {
                }
            }

            // initialization
            bridge
                .initialize(bridgeOptions)
                .then(() =&gt; {
                    bridge.advertisement.on('banner_state_changed', state =&gt; sendMessageToUnity('OnBannerStateChanged', state))
                    bridge.advertisement.on('interstitial_state_changed', state =&gt; sendMessageToUnity('OnInterstitialStateChanged', state))
                    bridge.advertisement.on('rewarded_state_changed', state =&gt; sendMessageToUnity('OnRewardedStateChanged', state))
                    bridge.game.on('visibility_state_changed', state =&gt; sendMessageToUnity('OnVisibilityStateChanged', state))

                    if (bridge.platform.id === bridge.PLATFORM_ID.GAME_DISTRIBUTION) {
                        bridge.advertisement.showInterstitial()
                    }

                    let unityLoader = document.createElement('script')
                    unityLoader.src = 'Build/MRR_Playgama_V1.loader.js'
                    unityLoader.onload = () =&gt; {
                        createUnityInstance(
                            canvas,
                            {
                                dataUrl: 'https://cdn.jsdelivr.net/npm/mrracerr@1.0.1/e76479960c15baa5858e009711c8dee5.data.unityweb',
                                frameworkUrl: 'Build/f189eb3d21d04dc8f4f165aa4719eac9.js.unityweb',
                                codeUrl: 'Build/b680d93bd592fc39044901ae38a622b3.wasm.unityweb',
                                streamingAssetsUrl: 'StreamingAssets',
                                companyName: 'ChennaiGames',
                                productName: 'MR RACER',
                                productVersion: '1.5.6.2',
                                // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
                                // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
                            },
                            onUnityLoadingProgressChanged)
                            .then((unityInstance) =&gt; {
                                window.unityInstance = unityInstance
                                loadingOverlay.remove()
                                canvas.focus()
                            })
                            .catch((error) =&gt; {
                                console.error(error)
                            })
                    }
                    document.body.appendChild(unityLoader)
                })
                .catch(error =&gt; console.error(error))

            // storage
            window.getStorageDefaultType = function() {

            }

            window.getIsStorageSupported = function(storageType) {

            }

            window.getIsStorageAvailable = function(storageType) {

            }

            window.getStorageData = function(key, storageType) {
                let keys = key.split(STORAGE_KEYS_SEPARATOR)

                bridge.storage.get(keys, storageType, false)
                    .then(data =&gt; {
                        if (keys.length &gt; 1) {
                            let values = []

                            for (let i = 0; i &lt; keys.length; i++) {
                                let value = data[i]
                                if (value) {
                                    if (typeof value !== 'string') {
                                        value = JSON.stringify(value)
                                    }

                                    values.push(value)
                                } else {
                                    values.push('')
                                }
                            }

                            sendMessageToUnity('OnGetStorageDataSuccess', `${key}${STORAGE_DATA_SEPARATOR}${values.join(STORAGE_VALUES_SEPARATOR)}`)
                        } else {
                            if (data[0]) {
                                if (typeof data[0] !== 'string') {
                                    data = JSON.stringify(data[0])
                                }
                            } else {
                                data = ''
                            }

                            sendMessageToUnity('OnGetStorageDataSuccess', `${key}${STORAGE_DATA_SEPARATOR}${data}`)
                        }
                    })
                    .catch(error =&gt; {
                        sendMessageToUnity('OnGetStorageDataFailed', key)
                    })
            }

            window.setStorageData = function(key, value, storageType) {
                let keys = key.split(STORAGE_KEYS_SEPARATOR)
                let values = value.split(STORAGE_VALUES_SEPARATOR)

                bridge.storage.set(keys, values, storageType)
                    .then(() =&gt; {
                        sendMessageToUnity('OnSetStorageDataSuccess', key)
                    })
                    .catch(error =&gt; {

                    .catch(error =&gt; {
                        sendMessageToUnity('OnAchievementsShowNativePopupCompleted', 'false')
                    })
            }

            window.achievementsGetList = function(options) {
                if (options) {
                    options = JSON.parse(options)
                }

                bridge.achievements.getList(options)
                    .then(data =&gt; {
                        if (data) {
                            if (typeof data !== 'string') {
                                data = JSON.stringify(data)
                            }

                            sendMessageToUnity('OnAchievementsGetListCompletedSuccess', data)
                        } else {
                            sendMessageToUnity('OnAchievementsGetListCompletedSuccess', '')
                        }
                    })
                    .catch(error =&gt; {
                        sendMessageToUnity('OnAchievementsGetListCompletedFailed', 'false')
                    })
            }
        &lt;/script&gt;
    &lt;/body&gt;"></iframe>
</main>
