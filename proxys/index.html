<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voidware — Proxys</title>

<meta name="theme-color" content="#080510">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(125, 45, 220, 0.22),
            transparent 45%
        ),
        #07050c;

    color: #f5f0ff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;
}

/* =========================================
   HEADER
========================================= */

header {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 60px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    background: rgba(7,5,12,0.94);

    border-bottom:
        1px solid
        rgba(155,77,255,0.25);

    backdrop-filter: blur(16px);

    z-index: 100;
}

/* =========================================
   LOGO
========================================= */

.logo {
    display: flex;
    align-items: center;

    gap: 9px;

    min-width: 0;
}

.logo-icon {
    width: 34px;
    height: 34px;

    display: grid;
    place-items: center;

    flex-shrink: 0;

    border-radius: 9px;

    background:
        linear-gradient(
            135deg,
            #9b4dff,
            #5f20b8
        );

    box-shadow:
        0 0 25px
        rgba(145,70,255,0.35);

    font-weight: 900;
}

.logo-text {
    font-weight: 900;

    letter-spacing: 2px;
}

.page-name {
    color: #93889f;

    font-size: 12px;

    margin-left: 3px;
}

/* =========================================
   CONTROLS
========================================= */

.controls {
    display: flex;

    align-items: center;

    gap: 7px;
}

button,
select {
    font-family: inherit;
}

.control {
    height: 35px;

    padding:
        0 11px;

    border:
        1px solid
        rgba(155,77,255,0.28);

    border-radius: 9px;

    background:
        rgba(255,255,255,0.04);

    color: #ddd3ea;

    font-size: 12px;

    font-weight: 800;

    cursor: pointer;

    outline: none;

    transition:
        border-color .2s,
        background .2s,
        transform .15s;
}

.control:hover {
    border-color:
        rgba(155,77,255,0.75);

    background:
        rgba(155,77,255,0.11);

    color: white;
}

.control:active {
    transform: scale(.97);
}

.control:disabled {
    opacity: .5;

    cursor: not-allowed;
}

#linkSelector {
    min-width: 115px;

    max-width: 180px;
}

#linkSelector option {
    background: #100a17;

    color: white;
}

/* =========================================
   GAME AREA
========================================= */

#gameArea {
    position: fixed;

    top: 60px;
    left: 0;
    right: 0;
    bottom: 0;

    background: #000;
}

#proxyFrame {
    width: 100%;
    height: 100%;

    display: block;

    border: 0;

    background: #000;
}

/* =========================================
   LOADING
========================================= */

#loading {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    gap: 14px;

    background:
        radial-gradient(
            circle,
            rgba(100,40,180,.12),
            #050308 60%
        );

    z-index: 20;
}

.spinner {
    width: 38px;
    height: 38px;

    border:
        3px solid
        rgba(155,77,255,.18);

    border-top-color:
        #9b4dff;

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}

.loading-text {
    color: #93889f;

    font-size: 13px;
}

/* =========================================
   ERROR
========================================= */

#error {
    position: absolute;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 25px;

    background: #050308;

    z-index: 30;
}

.error-box {
    width: 100%;

    max-width: 500px;
}

.error-icon {
    font-size: 45px;

    margin-bottom: 12px;
}

.error-title {
    font-size: 23px;

    font-weight: 900;

    margin-bottom: 9px;
}

#errorMessage {
    color: #93889f;

    font-size: 13px;

    line-height: 1.6;

    margin-bottom: 18px;
}

.retry {
    border:
        1px solid
        rgba(155,77,255,.4);

    background:
        rgba(155,77,255,.1);

    color: white;

    padding:
        10px 16px;

    border-radius: 9px;

    cursor: pointer;

    font-weight: 800;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:700px) {

    header {
        padding: 0 9px;
    }

    .logo-text {
        display: none;
    }

    .page-name {
        display: none;
    }

    .controls {
        gap: 4px;
    }

    .control {
        padding: 0 8px;
    }

    #linkSelector {
        min-width: 85px;

        max-width: 105px;
    }

    .text-button {
        display: none;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">

        <div class="logo-icon">
            V
        </div>

        <div class="logo-text">
            VOIDWARE
        </div>

        <div class="page-name">
            / Proxys
        </div>

    </div>


    <div class="controls">

        <select
            id="linkSelector"
            class="control"
            disabled
        >
            <option>
                Loading...
            </option>
        </select>


        <button
            id="updateButton"
            class="control"
            disabled
        >
            ↻
            <span class="text-button">
                Update
            </span>
        </button>


        <button
            id="fullscreenButton"
            class="control"
            disabled
            title="Fullscreen"
        >
            ⛶
        </button>


        <button
            id="blankButton"
            class="control"
            disabled
            title="Open in about:blank"
        >
            ↗
        </button>


        <button
            id="homeButton"
            class="control"
            title="Voidware Home"
        >
            ←
        </button>

    </div>

</header>


<div id="gameArea">

    <iframe
        id="proxyFrame"
        title="Voidware Proxy"
        allow="
            accelerometer;
            autoplay;
            clipboard-read;
            clipboard-write;
            encrypted-media;
            fullscreen;
            gamepad;
            gyroscope;
            microphone;
            camera;
            midi;
            payment;
            picture-in-picture;
            screen-wake-lock;
            web-share
        "
        allowfullscreen
        referrerpolicy="no-referrer"
    ></iframe>


    <div id="loading">

        <div class="spinner"></div>

        <div class="loading-text">
            Loading proxy database...
        </div>

    </div>


    <div id="error">

        <div class="error-box">

            <div class="error-icon">
                ⚠️
            </div>

            <div class="error-title">
                Could not load proxies
            </div>

            <div
                id="errorMessage"
            ></div>

            <button
                class="retry"
                id="retryButton"
            >
                Try Again
            </button>

        </div>

    </div>

</div>


<script>

/*
==================================================
VOIDWARE PROXY DATABASE
==================================================

Repository:

voidware1/voidware

GitHub Pages:

https://voidware1.github.io/voidware/

This page:

/Proxys/index.html

Database:

/Proxys/interstellar.txt
==================================================
*/


/*
==================================================
DATABASE URL
==================================================
*/

const DATABASE_URL =
    "/voidware/Proxys/interstellar.txt";


/*
==================================================
HOME URL
==================================================
*/

const HOME_URL =
    "/voidware/";


/*
==================================================
DOM ELEMENTS
==================================================
*/

const frame =
    document.getElementById(
        "proxyFrame"
    );

const selector =
    document.getElementById(
        "linkSelector"
    );

const updateButton =
    document.getElementById(
        "updateButton"
    );

const fullscreenButton =
    document.getElementById(
        "fullscreenButton"
    );

const blankButton =
    document.getElementById(
        "blankButton"
    );

const homeButton =
    document.getElementById(
        "homeButton"
    );

const retryButton =
    document.getElementById(
        "retryButton"
    );

const loading =
    document.getElementById(
        "loading"
    );

const errorScreen =
    document.getElementById(
        "error"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );


/*
==================================================
STATE
==================================================
*/

let proxyLinks = [];

let currentLink = -1;


/*
==================================================
SHOW ERROR
==================================================
*/

function showError(message) {

    loading.style.display =
        "none";

    errorScreen.style.display =
        "flex";

    errorMessage.textContent =
        message;

}


/*
==================================================
HIDE ERROR
==================================================
*/

function hideError() {

    errorScreen.style.display =
        "none";

}


/*
==================================================
LOAD DATABASE
==================================================
*/

async function loadDatabase() {

    loading.style.display =
        "flex";

    hideError();


    selector.disabled =
        true;

    updateButton.disabled =
        true;

    fullscreenButton.disabled =
        true;

    blankButton.disabled =
        true;


    try {

        /*
        Cache busting makes sure that
        pressing Update gets the newest
        TXT file from GitHub Pages.
        */

        const response =
            await fetch(
                DATABASE_URL
                +
                "?v="
                +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "GitHub Pages returned HTTP "
                +
                response.status
                +
                " when loading Proxys/interstellar.txt."
            );

        }


        const text =
            await response.text();


        /*
        Split the TXT file into lines.
        */

        const lines =
            text.split(/\r?\n/);


        proxyLinks = [];


        /*
        Read every line.
        */

        for (
            let i = 0;
            i < lines.length;
            i++
        ) {

            let line =
                lines[i].trim();


            /*
            Ignore blank lines.
            */

            if (!line) {
                continue;
            }


            /*
            Ignore comments.

            Example:

            # This is a comment
            */

            if (
                line.startsWith("#")
            ) {
                continue;
            }


            /*
            Check whether the line
            contains a valid URL.
            */

            try {

                const url =
                    new URL(line);


                /*
                Only allow HTTP/HTTPS.
                */

                if (
                    url.protocol !== "http:"
                    &&
                    url.protocol !== "https:"
                ) {

                    continue;

                }


                proxyLinks.push(
                    url.href
                );


            } catch {

                /*
                Invalid lines are simply
                ignored.
                */

                continue;

            }

        }


        /*
        Make sure we found something.
        */

        if (
            proxyLinks.length === 0
        ) {

            throw new Error(
                "No valid proxy URLs were found in Proxys/interstellar.txt."
            );

        }


        /*
        Create the dropdown.
        */

        buildSelector();


        /*
        Enable controls.
        */

        selector.disabled =
            false;

        updateButton.disabled =
            false;

        fullscreenButton.disabled =
            false;

        blankButton.disabled =
            false;


        loading.style.display =
            "none";


        /*
        Restore currently selected
        link when possible.
        */

        if (
            currentLink < 0
            ||
            currentLink >= proxyLinks.length
        ) {

            currentLink = 0;

        }


        selector.value =
            String(currentLink);


        loadSelectedProxy();


    } catch(error) {

        console.error(error);

        showError(
            error.message
            ||
            "Unknown database error."
        );

    }

}


/*
==================================================
BUILD DROPDOWN
==================================================
*/

function buildSelector() {

    selector.innerHTML = "";


    for (
        let i = 0;
        i < proxyLinks.length;
        i++
    ) {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            String(i);


        /*
        Automatically numbered.

        0 becomes Link 1
        1 becomes Link 2
        2 becomes Link 3
        */

        option.textContent =
            "Link "
            +
            String(i + 1);


        selector.appendChild(
            option
        );

    }

}


/*
==================================================
LOAD SELECTED PROXY
==================================================
*/

function loadSelectedProxy() {

    if (
        currentLink < 0
        ||
        currentLink >= proxyLinks.length
    ) {

        return;

    }


    const url =
        proxyLinks[currentLink];


    frame.src =
        url;

}


/*
==================================================
DROPDOWN CHANGE
==================================================
*/

selector.addEventListener(
    "change",
    function() {

        currentLink =
            Number(
                selector.value
            );


        loadSelectedProxy();

    }
);


/*
==================================================
UPDATE BUTTON
==================================================
*/

updateButton.addEventListener(
    "click",
    function() {

        loadDatabase();

    }
);


/*
==================================================
FULLSCREEN
==================================================
*/

fullscreenButton.addEventListener(
    "click",
    function() {

        if (
            frame.requestFullscreen
        ) {

            frame.requestFullscreen();

        }

        else if (
            frame.webkitRequestFullscreen
        ) {

            frame.webkitRequestFullscreen();

        }

    }
);


/*
==================================================
ABOUT:BLANK
==================================================
*/

blankButton.addEventListener(
    "click",
    function() {

        if (
            currentLink < 0
            ||
            currentLink >= proxyLinks.length
        ) {

            return;

        }


        const url =
            proxyLinks[currentLink];


        /*
        Open a blank tab.
        */

        const newWindow =
            window.open(
                "about:blank",
                "_blank"
            );


        if (!newWindow) {

            alert(
                "Popup blocked. Please allow popups for Voidware."
            );

            return;

        }


        /*
        Put a fullscreen iframe
        inside the about:blank page.
        */

        newWindow.document.open();


        newWindow.document.write(
`
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Voidware</title>

<style>

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    overflow: hidden;

    background: #000;

}

iframe {

    width: 100%;
    height: 100%;

    border: 0;

    display: block;

}

</style>

</head>

<body>

<iframe
src="${escapeAttribute(url)}"
allow="
accelerometer;
autoplay;
clipboard-read;
clipboard-write;
encrypted-media;
fullscreen;
gamepad;
gyroscope;
microphone;
camera;
midi;
payment;
picture-in-picture;
screen-wake-lock;
web-share
"
allowfullscreen
></iframe>

</body>

</html>
`
        );


        newWindow.document.close();

    }
);


/*
==================================================
ESCAPE URL
==================================================
*/

function escapeAttribute(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/*
==================================================
HOME BUTTON
==================================================
*/

homeButton.addEventListener(
    "click",
    function() {

        window.location.href =
            HOME_URL;

    }
);


/*
==================================================
RETRY BUTTON
==================================================
*/

retryButton.addEventListener(
    "click",
    function() {

        loadDatabase();

    }
);


/*
==================================================
START
==================================================
*/

loadDatabase();

</script>

</body>
</html>
```
