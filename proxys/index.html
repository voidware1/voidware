<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voidware - Proxys</title>

<style>
:root {
  --bg: #07050c;
  --panel: #100a17;
  --panel2: #160d21;
  --purple: #9b4dff;
  --purple2: #6721c6;
  --text: #f5f0ff;
  --muted: #93889f;
  --border: rgba(155,77,255,.22);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(155,77,255,.16),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 20%,
      rgba(103,33,198,.14),
      transparent 28%
    ),
    var(--bg);
}

/* HEADER */

header {
  position: sticky;
  top: 0;
  z-index: 100;

  height: 72px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 28px;

  background: rgba(7,5,12,.82);
  backdrop-filter: blur(14px);

  border-bottom: 1px solid var(--border);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;

  color: white;
  text-decoration: none;

  font-weight: 900;
  letter-spacing: 1px;
}

.logo-icon {
  width: 38px;
  height: 38px;

  display: grid;
  place-items: center;

  border-radius: 11px;

  font-size: 20px;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--purple2)
    );

  box-shadow:
    0 0 25px rgba(155,77,255,.35);
}

.logo-text {
  font-size: 18px;
}

.nav-links {
  display: flex;
  gap: 8px;
}

.nav-link {
  color: var(--muted);

  text-decoration: none;

  padding: 10px 14px;

  border-radius: 10px;

  transition: .2s;
}

.nav-link:hover {
  color: white;

  background:
    rgba(155,77,255,.1);
}

.nav-link.active {
  color: white;

  background:
    rgba(155,77,255,.12);
}

/* HERO */

.hero {
  width: min(1200px, calc(100% - 32px));

  margin: 0 auto;

  padding: 75px 0 45px;

  text-align: center;
}

.badge {
  display: inline-flex;

  padding: 8px 14px;

  border: 1px solid var(--border);

  border-radius: 999px;

  background:
    rgba(155,77,255,.08);

  color: #c99fff;

  font-size: 12px;

  font-weight: 800;

  letter-spacing: 1.5px;
}

.hero h1 {
  margin: 18px 0 12px;

  font-size: clamp(42px, 7vw, 78px);

  line-height: .95;

  font-weight: 1000;

  letter-spacing: -3px;

  background:
    linear-gradient(
      90deg,
      #fff,
      #cda5ff,
      #8d3cff
    );

  -webkit-background-clip: text;
  background-clip: text;

  color: transparent;
}

.hero p {
  max-width: 680px;

  margin: 0 auto;

  color: var(--muted);

  font-size: 16px;

  line-height: 1.7;
}

/* CONTENT */

.content {
  width: min(1200px, calc(100% - 32px));

  margin: 0 auto;

  padding-bottom: 70px;
}

.section-header {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 22px;
}

.section-title {
  margin: 0;

  font-size: 22px;
}

.proxy-count {
  color: var(--muted);

  font-size: 13px;
}

/* PROXY GRID */

.proxy-grid {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 18px;
}

.proxy-card {
  position: relative;

  overflow: hidden;

  padding: 24px;

  border-radius: 18px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.025),
      transparent
    ),
    var(--panel);

  border: 1px solid var(--border);

  transition:
    transform .2s,
    border-color .2s,
    box-shadow .2s;
}

.proxy-card::before {
  content: "";

  position: absolute;

  width: 160px;
  height: 160px;

  top: -90px;
  right: -90px;

  border-radius: 50%;

  background:
    rgba(155,77,255,.16);

  filter: blur(25px);

  pointer-events: none;
}

.proxy-card:hover {
  transform: translateY(-5px);

  border-color:
    rgba(155,77,255,.5);

  box-shadow:
    0 18px 45px rgba(0,0,0,.3);
}

.proxy-number {
  color: #b87aff;

  font-size: 11px;

  font-weight: 900;

  letter-spacing: 1.5px;

  text-transform: uppercase;
}

.proxy-name {
  margin-top: 8px;

  font-size: 22px;

  font-weight: 900;
}

.proxy-file {
  margin-top: 8px;

  color: var(--muted);

  font-family: monospace;

  font-size: 12px;

  word-break: break-all;
}

.proxy-actions {
  display: flex;

  gap: 9px;

  margin-top: 20px;
}

.proxy-button {
  flex: 1;

  padding: 11px 14px;

  border-radius: 10px;

  border: 0;

  cursor: pointer;

  color: white;

  font-size: 13px;

  font-weight: 800;

  text-align: center;

  text-decoration: none;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--purple2)
    );

  transition: .2s;
}

.proxy-button:hover {
  transform: translateY(-2px);
}

.proxy-button.secondary {
  background: #1b1026;

  border: 1px solid var(--border);
}

/* EMPTY / ERROR */

.message {
  grid-column: 1 / -1;

  padding: 45px 25px;

  text-align: center;

  color: var(--muted);

  border: 1px dashed var(--border);

  border-radius: 18px;

  background: rgba(16,10,23,.55);
}

.message-title {
  margin-bottom: 8px;

  color: white;

  font-size: 20px;

  font-weight: 900;
}

.message-code {
  margin-top: 12px;

  color: #b87aff;

  font-family: monospace;

  font-size: 12px;
}

/* FOOTER */

footer {
  padding: 30px 20px;

  text-align: center;

  color: var(--muted);

  font-size: 13px;

  border-top: 1px solid var(--border);
}

/* MOBILE */

@media (max-width: 800px) {

  .proxy-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  header {
    padding: 0 16px;
  }

  .nav-link {
    padding: 8px;
    font-size: 13px;
  }
}

@media (max-width: 550px) {

  .hero {
    padding-top: 50px;
  }

  .hero h1 {
    letter-spacing: -2px;
  }

  .proxy-grid {
    grid-template-columns: 1fr;
  }

  .logo-text {
    display: none;
  }

  .section-header {
    align-items: flex-start;
    gap: 10px;
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>

  <a class="logo" href="/voidware/">

    <div class="logo-icon">
      V
    </div>

    <div class="logo-text">
      VOIDWARE
    </div>

  </a>

  <nav class="nav-links">

    <a
      class="nav-link"
      href="/voidware/"
    >
      Home
    </a>

    <a
      class="nav-link"
      href="/voidware/games/index.html"
    >
      Games
    </a>

    <a
      class="nav-link active"
      href="/voidware/proxys/index.html"
    >
      Proxys
    </a>

    <a
      class="nav-link"
      href="/voidware/apps/index.html"
    >
      Apps
    </a>

  </nav>

</header>


<section class="hero">

  <div class="badge">
    VOIDWARE PROXYS
  </div>

  <h1>
    PROXYS
  </h1>

  <p>
    Browse the available Voidware proxy pages
    and launch the one you want.
  </p>

</section>


<main class="content">

  <div class="section-header">

    <h2 class="section-title">
      Available Proxys
    </h2>

    <div
      class="proxy-count"
      id="proxyCount"
    >
      Loading...
    </div>

  </div>


  <div
    class="proxy-grid"
    id="proxyGrid"
  >

    <div class="message">

      <div class="message-title">
        Loading Proxys...
      </div>

      Please wait.

    </div>

  </div>

</main>


<footer>
  VOIDWARE • PROXYS
</footer>


<script>

/*
  PROXY PAGE MANIFEST

  This file contains the filenames of the
  proxy HTML pages located directly inside
  /voidware/proxys/

  Example:

  interstellar.html
  example.html
  anotherproxy.html
*/

const DATABASE_URL =
  "/voidware/proxys/database/proxy-pages.txt";


const PROXY_FOLDER =
  "/voidware/proxys/";


async function loadProxyPages() {

  const grid =
    document.getElementById("proxyGrid");

  const count =
    document.getElementById("proxyCount");

  try {

    const response =
      await fetch(
        DATABASE_URL,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }

    const text =
      await response.text();


    /*
      Read filenames from TXT.
    */

    const files =
      text
        .split(/\r?\n/)
        .map(function(line) {
          return line.trim();
        })
        .filter(function(line) {

          return (
            line &&
            !line.startsWith("#") &&
            line.toLowerCase().endsWith(".html")
          );

        });


    if (!files.length) {

      count.textContent =
        "0 proxys";

      grid.innerHTML =
        `
        <div class="message">

          <div class="message-title">
            No Proxys Found
          </div>

          Add HTML filenames to:

          <div class="message-code">
            proxys/database/proxy-pages.txt
          </div>

        </div>
        `;

      return;
    }


    count.textContent =
      files.length +
      (files.length === 1 ? " proxy" : " proxys");


    grid.innerHTML = "";


    files.forEach(function(file, index) {

      /*
        Make sure the page stays inside
        the proxys folder.
      */

      const safeFile =
        file
          .replace(/^\/+/, "")
          .replace(/^proxys\//i, "")
          .replace(/^voidware\//i, "");


      const pageURL =
        PROXY_FOLDER +
        encodeURIComponent(safeFile);


      const card =
        document.createElement("div");

      card.className =
        "proxy-card";


      card.innerHTML =
        `
        <div class="proxy-number">
          PROXY ${index + 1}
        </div>

        <div class="proxy-name">
          Proxy ${index + 1}
        </div>

        <div class="proxy-file">
          ${escapeHTML(safeFile)}
        </div>

        <div class="proxy-actions">

          <a
            class="proxy-button"
            href="${escapeAttribute(pageURL)}"
          >
            Open
          </a>

          <a
            class="proxy-button secondary"
            href="${escapeAttribute(pageURL)}"
            target="_blank"
            rel="noopener"
          >
            New Tab
          </a>

        </div>
        `;


      grid.appendChild(card);

    });


  } catch (error) {

    count.textContent =
      "Error";


    grid.innerHTML =
      `
      <div class="message">

        <div class="message-title">
          Could Not Load Proxys
        </div>

        Make sure this file exists:

        <div class="message-code">
          /voidware/proxys/database/proxy-pages.txt
        </div>

      </div>
      `;

    console.error(
      "Proxy database error:",
      error
    );

  }

}


/* HTML SECURITY HELPERS */

function escapeHTML(value) {

  return value
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

  return value
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}


/* START */

loadProxyPages();

</script>

</body>
</html>
