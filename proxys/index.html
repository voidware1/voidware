<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voidware — Proxys</title>

<meta name="theme-color" content="#080510">

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #07050c;
  --panel: #100a17;
  --panel2: #160d21;
  --purple: #9b4dff;
  --purple2: #6721c6;

}

html {
  scroll-behavior: smooth;
}

body {

    radial-gradient(
      circle at 50% -10%,
      rgba(125,45,220,.24),

    var(--bg);

}

/* =========================================
   HEADER
========================================= */

header {

    min(

.logo-icon {

  border-radius: 11px;

   MAIN

.container {

   HERO

.hero {

.update-status {

  height: 7px;

  box-shadow:

/* =========================================
   TOOLBAR
========================================= */

.toolbar {
  display: flex;

  gap: 10px;

  margin-bottom: 25px;
}

.search-box {
  position: relative;

  flex: 1;
}

.search-box input {
  width: 100%;

  height: 46px;

  border:
    1px solid

  border-radius: 11px;

  background:
    rgba(5,3,8,.7);

  color: white;

  outline: none;

  padding:
    0 15px 0 42px;

  font-size: 14px;
}

.search-box input:focus {
  border-color:
    rgba(155,77,255,.7);

  box-shadow:
    0 0 0 3px
    rgba(155,77,255,.08);
}

.search-icon {
  position: absolute;

  left: 14px;

  top: 50%;

  transform:
    translateY(-50%);

  color: #81748d;
}

.refresh-button {
  height: 46px;

  border:
    1px solid
    var(--border);

  border-radius: 11px;

  padding:
    0 15px;

  background:
    rgba(255,255,255,.035);

  color: #ddd3ea;

  cursor: pointer;

  font-weight: 800;
}

.refresh-button:hover {
  border-color:
    rgba(155,77,255,.7);

  background:
    rgba(155,77,255,.09);

  color: white;
}

/* =========================================
   PROXY GRID
========================================= */

.proxys-grid {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(
        230px,
        1fr
      )
    );

  gap: 16px;
}

/* =========================================
   PROXY CARD
========================================= */

.proxy-card {
  position: relative;

  min-height: 190px;

  padding: 19px;

  overflow: hidden;

  display: flex;

  flex-direction: column;

  border:
    1px solid
    var(--border);

  border-radius: 15px;

  background:
    linear-gradient(
      145deg,
      rgba(24,14,37,.96),
      rgba(11,7,17,.96)
    );

  text-decoration: none;

  color: white;

  transition:
    transform .2s,
    border-color .2s,
    box-shadow .2s;
}

.proxy-card::before {
  content: "";

  position: absolute;

  width: 150px;
  height: 150px;

  right: -60px;
  top: -65px;

  border-radius: 50%;

  background:
    rgba(155,77,255,.12);

  filter:
    blur(10px);
}

.proxy-card:hover {
  transform:
    translateY(-4px);

  border-color:
    rgba(155,77,255,.65);

  box-shadow:
    0 18px 45px
    rgba(0,0,0,.3);
}

.proxy-icon {
  position: relative;

  width: 52px;
  height: 52px;

  display: grid;

  place-items: center;

  margin-bottom: 16px;

  border:
    1px solid
    rgba(155,77,255,.28);

  border-radius: 13px;

  background:
    linear-gradient(
      135deg,
      rgba(155,77,255,.22),
      rgba(103,33,198,.08)
    );

  font-size: 25px;
}

.proxy-title {
  position: relative;

  font-size: 18px;

  font-weight: 900;

  margin-bottom: 6px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.proxy-file {
  position: relative;

  color: #766b80;

  font-size: 11px;

  margin-bottom: auto;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;
}

.open-label {
  position: relative;

  margin-top: 17px;

  color: #b47cff;

  font-size: 12px;

  font-weight: 900;
}

/* =========================================
   EMPTY / LOADING
========================================= */

.message {
  grid-column:
    1 / -1;

  padding:
    55px 20px;

  text-align: center;

  border:
    1px solid
    var(--border);

  border-radius: 15px;

  background:
    rgba(255,255,255,.02);

  color: var(--muted);
}

.message-title {
  color: white;

  font-size: 18px;

  font-weight: 900;

  margin-bottom: 7px;
}

/* =========================================
   FOOTER
========================================= */

footer {
  border-top:
    1px solid
    rgba(255,255,255,.06);

  padding:
    28px 16px;

  text-align: center;

  color: #655b6e;

  font-size: 12px;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:700px) {

  .hero {
    flex-direction: column;

    align-items: flex-start;
  }

  .update-status {
    align-self: flex-start;
  }

}

  .nav-buttons {
    display: none;
  }

  .container {
    width:
      calc(100% - 22px);

    padding-top: 40px;
  }

  .toolbar {
    flex-direction: column;
  }

  .refresh-button {
    width: 100%;
  }

}

</style>
</head>

<body>

<!-- =========================================
     HEADER
========================================= -->

<header>

  <nav class="nav">

    <div class="logo">

      <div class="logo-icon">
        V
      </div>

      VOIDWARE

    </div>

    <div class="nav-buttons">

      <button
        class="nav-button"
        onclick="goHome()"
      >
        Home
      </button>

      <button
        class="nav-button"
        onclick="goTo('games')"
      >
        Games
      </button>

      <button
        class="nav-button"
        onclick="goTo('apps')"
      >
        Apps
      </button>

    </div>

  </nav>

</header>

<!-- =========================================
     CONTENT
========================================= -->

<main class="container">

  <section class="hero">

    <div>

      <h1>
        Proxys
      </h1>

      <p>
        Browse the Voidware proxy collection.
        New HTML proxy pages are detected automatically.
      </p>

    </div>

    <div class="update-status">

      <span class="status-dot"></span>

      <span id="statusText">
        Checking library...
      </span>

    </div>

  </section>

  <!-- SEARCH -->

  <div class="toolbar">

    <div class="search-box">

      <span class="search-icon">
        🔎
      </span>

      <input
        id="searchInput"
        type="search"
        placeholder="Search proxys..."
        autocomplete="off"
      >

    </div>

    <button
      id="refreshButton"
      class="refresh-button"
    >
      ↻ Refresh
    </button>

  </div>

  <!-- PROXY GRID -->

  <section
    id="proxysGrid"
    class="proxys-grid"
  >

    <div class="message">

      <div class="message-title">
        Loading proxys...
      </div>

      Please wait while Voidware checks GitHub.

    </div>

  </section>

</main>

<footer>

  VOIDWARE • Proxy Library

</footer>

<script>

/*
==================================================
VOIDWARE PROXY LIBRARY
==================================================

Repository:
https://github.com/voidware1/voidware

GitHub Pages:
https://voidware1.github.io/voidware/

This library automatically scans:

/proxys/

for HTML files.

==================================================
*/

/* =========================================
   CONFIG
========================================= */

var GITHUB_USER =
  "voidware1";

var GITHUB_REPO =
  "voidware";

var PROXYS_FOLDER =
  "proxys";

var GITHUB_API =
  "https://api.github.com/repos/"
  + GITHUB_USER
  + "/"
  + GITHUB_REPO
  + "/contents/"
  + PROXYS_FOLDER;


/*
==================================================
OPTIONAL PROXY METADATA
==================================================

Example:

"my-proxy.html": {
  title: "My Proxy",
  icon: "🌐"
}

==================================================
*/

var PROXY_METADATA = {

  /*
  "example.html": {
    title: "Example Proxy",
    icon: "🌐"
  }
  */

};


/*
==================================================
STATE
==================================================
*/

var allProxys = [];

var searchInput =
  document.getElementById(
    "searchInput"
  );

var proxysGrid =
  document.getElementById(
    "proxysGrid"
  );

var statusText =
  document.getElementById(
    "statusText"
  );

var refreshButton =
  document.getElementById(
    "refreshButton"
  );


/*
==================================================
FORMAT TITLE
==================================================
*/

function formatTitle(filename) {

  var name =
    filename
      .replace(/\.html$/i, "")
      .replace(/[-_]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();

  if (!name) {
    return "Voidware Proxy";
  }

  return name
    .split(" ")
    .map(function(word) {

      return word.charAt(0).toUpperCase()
        + word.slice(1);

    })
    .join(" ");

}


/*
==================================================
GET PROXY INFO
==================================================
*/

function getProxyInfo(file) {

  var metadata =
    PROXY_METADATA[file.name];

  return {

    name: file.name,

    title:
      metadata && metadata.title
        ? metadata.title
        : formatTitle(file.name),

    icon:
      metadata && metadata.icon
        ? metadata.icon
        : "🌐",

    url:
      "/voidware/proxys/"
      + encodeURIComponent(file.name)

  };

}


/*
==================================================
LOAD PROXYS FROM GITHUB
==================================================
*/

async function loadProxys() {

  statusText.textContent =
    "Updating...";

  proxysGrid.innerHTML = `

    <div class="message">

      <div class="message-title">
        Updating library...
      </div>

      Checking GitHub for new proxys.

    </div>

  `;


  try {

    var response =
      await fetch(
        GITHUB_API
        + "?_="
        + Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "GitHub API returned "
        + response.status
      );

    }


    var files =
      await response.json();


    /*
    Only accept HTML files.

    Ignore:
    - index.html
    - proxy-maker.html
    */

    var proxyFiles =
      files.filter(function(file) {

        if (file.type !== "file") {
          return false;
        }

        if (!/\.html$/i.test(file.name)) {
          return false;
        }

        if (
          file.name.toLowerCase()
          === "index.html"
        ) {
          return false;
        }

        if (
          file.name.toLowerCase()
          === "proxy-maker.html"
        ) {
          return false;
        }

        return true;

      });


    allProxys =
      proxyFiles
        .map(getProxyInfo)
        .sort(function(a, b) {

          return a.title
            .localeCompare(
              b.title
            );

        });


    renderProxys();


    statusText.textContent =
      allProxys.length
      + " proxy"
      + (
        allProxys.length === 1
          ? ""
          : "s"
      )
      + " • Updated";


  } catch(error) {

    console.error(error);

    statusText.textContent =
      "Update failed";

    proxysGrid.innerHTML = `

      <div class="message">

        <div class="message-title">
          Couldn't load proxys
        </div>

        GitHub returned an error while
        checking the proxys folder.

        <br><br>

        <button
          class="refresh-button"
          onclick="loadProxys()"
        >
          Try Again
        </button>

      </div>

    `;

  }

}


/*
==================================================
RENDER
==================================================
*/

function renderProxys() {

  var query =
    searchInput.value
      .trim()
      .toLowerCase();


  var filtered =
    allProxys.filter(function(proxy) {

      return (
        proxy.title
          .toLowerCase()
          .includes(query)

        ||

        proxy.name
          .toLowerCase()
          .includes(query)
      );

    });


  if (!filtered.length) {

    proxysGrid.innerHTML = `

      <div class="message">

        <div class="message-title">
          No proxys found
        </div>

        ${
          query
            ? "Try a different search."
            : "Add an HTML proxy to the proxys folder."
        }

      </div>

    `;

    return;

  }


  proxysGrid.innerHTML =
    filtered
      .map(function(proxy) {

        return `

          <a
            class="proxy-card"
            href="${proxy.url}"
          >

            <div class="proxy-icon">
              ${escapeHTML(proxy.icon)}
            </div>

            <div class="proxy-title">
              ${escapeHTML(proxy.title)}
            </div>

            <div class="proxy-file">
              ${escapeHTML(proxy.name)}
            </div>

            <div class="open-label">
              Open Proxy →
            </div>

          </a>

        `;

      })
      .join("");

}


/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHTML(value) {

  return String(value)

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/*
==================================================
SEARCH
==================================================
*/

searchInput.addEventListener(
  "input",
  renderProxys
);


/*
==================================================
REFRESH
==================================================
*/

refreshButton.addEventListener(
  "click",
  loadProxys
);


/*
==================================================
NAVIGATION
==================================================
*/

function goHome() {

  window.location.href =
    "/voidware/";

}


function goTo(section) {

  var paths = {

    games:
      "/voidware/games/index.html",

    apps:
      "/voidware/apps/index.html"

  };


  if (paths[section]) {

    window.location.href =
      paths[section];

  }

}


/*
==================================================
START
==================================================
*/

loadProxys();

</script>

</body>
</html>
