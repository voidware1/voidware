
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voidware Proxy Maker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #24103d 0%, #10091c 45%, #07050d 100%);
    color: white;
}

header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: rgba(10, 5, 18, 0.9);
    border-bottom: 1px solid #392052;
    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #b86cff;
    text-decoration: none;
}

nav {
    display: flex;
    gap: 10px;
}

nav a {
    color: #d8c7e8;
    text-decoration: none;
    padding: 9px 13px;
    border-radius: 8px;
    transition: 0.2s;
}

nav a:hover {
    background: #26133b;
    color: white;
}

.container {
    width: min(1100px, calc(100% - 30px));
    margin: 35px auto 60px;
}

.hero {
    text-align: center;
    margin-bottom: 30px;
}

.hero h1 {
    margin: 0;
    font-size: 42px;
    background: linear-gradient(90deg, #a855f7, #d8b4fe);
    -webkit-background-clip: text;
    color: transparent;
}

.hero p {
    color: #aa9bb9;
    margin-top: 10px;
}

.panel {
    background: rgba(18, 10, 30, 0.9);
    border: 1px solid #3b2253;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 22px;

}

.panel h2 {
    margin-top: 0;
    color: #d8b4fe;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #cdbddd;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 9px;
    border: 1px solid #493060;
    background: #0d0815;
    color: white;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #a855f7;
    box-shadow: 0 0 0 2px rgba(168,85,247,0.15);
}

.field {
    margin-bottom: 20px;
}

.path-box {
    margin-top: 8px;
    padding: 12px;
    border-radius: 8px;
    background: #0a0610;
    border: 1px solid #30203f;
    color: #a78bfa;
    font-family: monospace;
    word-break: break-all;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    background: #7c3aed;

}

button:hover {
    transform: translateY(-1px);
    background: #9333ea;
}

button.secondary {
    background: #241532;
    border: 1px solid #493060;
}

button.secondary:hover {

}

.status {
    margin-top: 15px;
    color: #a99ab7;
    min-height: 20px;
}

.preview {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 18px;
}

.proxy-card {
    background: #10091a;
    border: 1px solid #38214e;
    border-radius: 12px;
    padding: 18px;
}

.proxy-card h3 {
    margin: 0 0 8px;
    color: #d8b4fe;
}

.proxy-card p {
    margin: 0;
    color: #8f809e;

    word-break: break-all;
}

textarea {
    width: 100%;
    min-height: 450px;
    resize: vertical;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #493060;
    background: #08050d;
    color: #d8c7e8;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.5;
    outline: none;
}

.empty {
    color: #84768e;
    padding: 20px 0;
}

.warning {
    padding: 13px;
    border-radius: 9px;
    background: rgba(245, 158, 11, 0.08);
    border: 1px solid rgba(245, 158, 11, 0.25);
    color: #fbbf24;
    margin-top: 15px;

    header {

        padding: 15px;
        flex-direction: column;

    }

    nav {

        justify-content: center;
    }

    }

</style>
</head>

<body>

<header>
    <a class="logo" href="/voidware/">Voidware</a>

    <nav>
        <a href="/voidware/">Home</a>
        <a href="/voidware/games/index.html">Games</a>
        <a href="/voidware/proxys/index.html">Proxys</a>
        <a href="/voidware/apps/index.html">Apps</a>
    </nav>
</header>

<div class="container">

    <div class="hero">
        <h1>Proxy Maker</h1>
        <p>Create a Voidware proxy page from a TXT database.</p>
    </div>

    <div class="panel">

        <h2>Page Settings</h2>

        <div class="field">
            <label for="pageName">Page Name</label>

            <input
                id="pageName"
                type="text"
                placeholder="My Proxys"
                value="Voidware Proxys"
            >
        </div>

        <div class="field">

            <label for="fileName">
                TXT Database File
            </label>

            <input
                id="fileName"
                type="text"
                placeholder="example.txt"
                value="example.txt"
            >

            <div
                class="path-box"
                id="pathBox"
            >
                /voidware/proxys/database/example.txt
            </div>

        </div>

        <div class="buttons">

            <button id="loadButton">
                Load Database
            </button>

            <button id="generateButton">
                Generate Page
            </button>

        </div>

        <div
            class="status"
            id="status"
        ></div>

        <div
            class="warning"
            id="warning"
        ></div>

    </div>


    <div class="panel">

        <h2>Database Preview</h2>

        <div
            id="preview"
            class="preview"
        >

            <div class="empty">
                Load a TXT database to preview its links.
            </div>

        </div>

    </div>


    <div class="panel">

        <h2>Generated HTML</h2>

        <textarea
            id="generatedCode"
            spellcheck="false"
            placeholder="Your generated HTML will appear here..."
        ></textarea>

        <div
            class="buttons"
            style="margin-top:15px;"
        >

            <button id="copyButton">
                Copy Code
            </button>

        </div>

    </div>

</div>


<script>

/*
==========================================================
VOIDWARE REPOSITORY
==========================================================
*/

const GITHUB_API_BASE =
    "https://api.github.com/repos/voidware1/voidware/contents/proxys/database/";

const RAW_BASE =
    "https://raw.githubusercontent.com/voidware1/voidware/main/proxys/database/";

let loadedLinks = [];


/*
==========================================================
UPDATE PATH
==========================================================
*/

function updatePath() {

    let file =
        document.getElementById("fileName").value.trim();

    if (!file) {
        file = "example.txt";
    }

    if (!file.toLowerCase().endsWith(".txt")) {
        file += ".txt";
    }

    document.getElementById("pathBox").textContent =
        "/voidware/proxys/database/" + file;
}


/*
==========================================================
LOAD DATABASE
==========================================================
*/

async function loadLinks() {

    const input =
        document.getElementById("fileName");

    const status =
        document.getElementById("status");

    const warning =
        document.getElementById("warning");

    const preview =
        document.getElementById("preview");

    let file =
        input.value.trim();

    if (!file) {
        file = "example.txt";
    }

    if (!file.toLowerCase().endsWith(".txt")) {
        file += ".txt";
    }

    input.value = file;

    updatePath();

    status.textContent =
        "Loading database...";

    warning.style.display =
        "none";

    preview.innerHTML =
        '<div class="empty">Loading...</div>';

    try {

        const apiURL =
            GITHUB_API_BASE +
            encodeURIComponent(file);

        const response =
            await fetch(
                apiURL,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "GitHub returned HTTP " +
                response.status
            );

        }

        const fileData =
            await response.json();

        if (!fileData.content) {

            throw new Error(
                "The TXT file did not contain readable content."
            );

        }

        const cleanBase64 =
            fileData.content.replace(/\s/g, "");

        const binary =
            atob(cleanBase64);

        const bytes =
            new Uint8Array(binary.length);

        for (
            let i = 0;
            i < binary.length;
            i++
        ) {

            bytes[i] =
                binary.charCodeAt(i);

        }

        const text =
            new TextDecoder("utf-8").decode(bytes);

        loadedLinks =
            text
            .split(/\r?\n/)
            .map(function(line) {
                return line.trim();
            })
            .filter(function(line) {

                return (
                    line &&
                    !line.startsWith("#") &&
                    /^https?:\/\//i.test(line)
                );

            });

        renderPreview();

        status.textContent =
            "Loaded " +
            loadedLinks.length +
            " proxy link(s) from " +
            file;

        if (loadedLinks.length === 0) {

            warning.style.display =
                "block";

            warning.textContent =
                "The TXT file exists, but no valid http:// or https:// links were found.";

        }

    } catch (error) {

        loadedLinks = [];

        preview.innerHTML =
            '<div class="empty">Unable to load the database.</div>';

        status.textContent =
            "Error: " +
            error.message;

        warning.style.display =
            "block";

        warning.textContent =
            "Make sure the TXT file exists in proxys/database/ and that the filename is correct.";

    }

}


/*
==========================================================
PREVIEW
==========================================================
*/

function renderPreview() {

    const preview =
        document.getElementById("preview");

    if (loadedLinks.length === 0) {

        preview.innerHTML =
            '<div class="empty">No links found.</div>';

        return;

    }

    preview.innerHTML = "";

    loadedLinks.forEach(
        function(link, index) {

            const card =
                document.createElement("div");

            card.className =
                "proxy-card";

            const title =
                document.createElement("h3");

            title.textContent =
                "Proxy " +
                (index + 1);

            const url =
                document.createElement("p");

            url.textContent =
                link;

            card.appendChild(title);
            card.appendChild(url);

            preview.appendChild(card);

        }
    );

}


/*
==========================================================
GENERATE HTML
==========================================================
*/

function buildGeneratedHTML(
    pageName,
    databasePath
) {

    const lines = [];

    const fileName =
        getFileNameFromPath(databasePath);

    const rawDatabaseURL =
        "https://raw.githubusercontent.com/voidware1/voidware/main/proxys/database/" +
        encodeURIComponent(fileName);


    /*
    HEAD
    */

    lines.push("<!DOCTYPE html>");
    lines.push('<html lang="en">');

    lines.push("<head>");

    lines.push(
        '<meta charset="UTF-8">'
    );

    lines.push(
        '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
    );

    lines.push(
        "<title>" +
        escapeHTML(pageName) +
        "</title>"
    );


    /*
    GENERATED PAGE CSS
    */

    lines.push("<style>");

    lines.push(`
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#24103d 0%,#10091c 45%,#07050d 100%);
    color:white;
}

header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    background:rgba(10,5,18,.9);
    border-bottom:1px solid #392052;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#b86cff;
    text-decoration:none;
}

nav{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

nav a{
    color:#d8c7e8;
    text-decoration:none;
    padding:9px 13px;
    border-radius:8px;
}

nav a:hover{
    background:#26133b;
    color:white;
}

.container{
    width:min(1100px,calc(100% - 30px));
    margin:35px auto;
}

h1{
    text-align:center;
    color:#d8b4fe;
    margin-bottom:25px;
}

.panel{
    background:rgba(18,10,30,.9);
    border:1px solid #3b2253;
    border-radius:15px;
    padding:20px;
}

select{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #493060;
    background:#0d0815;
    color:white;
    font-size:15px;
    outline:none;
    margin-bottom:12px;
}

select:focus{
    border-color:#a855f7;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

button{
    border:0;
    border-radius:9px;
    padding:11px 16px;
    background:#7c3aed;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#9333ea;
}

iframe{
    width:100%;
    height:600px;
    border:1px solid #493060;
    border-radius:10px;
    background:#000;
}

.status{
    color:#9686a4;
    margin-bottom:12px;
    font-size:14px;
}

@media(max-width:700px){

    header{
        height:auto;
        padding:15px;
        flex-direction:column;
        gap:12px;
    }

    iframe{
        height:500px;
    }

}
`);

    lines.push("</style>");
    lines.push("</head>");


    /*
    BODY
    */

    lines.push("<body>");

    lines.push("<header>");

    lines.push(
        '<a class="logo" href="/voidware/">Voidware</a>'
    );

    lines.push("<nav>");

    lines.push(
        '<a href="/voidware/">Home</a>'
    );

    lines.push(
        '<a href="/voidware/games/index.html">Games</a>'
    );

    lines.push(
        '<a href="/voidware/proxys/index.html">Proxys</a>'
    );

    lines.push(
        '<a href="/voidware/apps/index.html">Apps</a>'
    );

    lines.push("</nav>");
    lines.push("</header>");


    /*
    MAIN
    */

    lines.push(
        '<div class="container">'
    );

    lines.push(
        "<h1>" +
        escapeHTML(pageName) +
        "</h1>"
    );

    lines.push(
        '<div class="panel">'
    );

    lines.push(
        '<div class="status" id="status">Loading links...</div>'
    );

    lines.push(
        '<select id="linkSelect"></select>'
    );

    lines.push(
        '<div class="buttons">'
    );

    lines.push(
        '<button id="openBlank">Open in About:Blank</button>'
    );

    lines.push(
        '<button id="fullscreen">Fullscreen</button>'
    );

    lines.push("</div>");

    lines.push(`
<iframe
    id="proxyFrame"
    allow="accelerometer *; autoplay *; clipboard-read *; clipboard-write *; encrypted-media *; fullscreen *; geolocation *; gyroscope *; microphone *; camera *; midi *; payment *; picture-in-picture *; screen-wake-lock *; sync-xhr *; web-share *"
    allowfullscreen>
</iframe>
`);

    lines.push("</div>");
    lines.push("</div>");


    /*
    GENERATED PAGE SCRIPT
    */

    lines.push("<script>");

    lines.push(
        "const DATABASE_URL=" +
        JSON.stringify(rawDatabaseURL) +
        ";"
    );

    lines.push(`

let proxyLinks = [];

let currentLink = "";

const select =
    document.getElementById("linkSelect");

const frame =
    document.getElementById("proxyFrame");

const status =
    document.getElementById("status");


/*
==========================================================
LOAD DATABASE
==========================================================
*/

async function loadDatabase(){

    try{

        const response =
            await fetch(
                DATABASE_URL,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const text =
            await response.text();

        proxyLinks =
            text
            .split(/\\\\r?\\\\n/)
            .map(function(line){

                return line.trim();

            })
            .filter(function(line){

                return (
                    line &&
                    !line.startsWith("#") &&
                    /^https?:\\\\/\\\\//i.test(line)
                );

            });


        if(proxyLinks.length === 0){

            status.textContent =
                "No links found.";

            return;

        }


        /*
        Generic dropdown names.
        URLs are not displayed.
        */

        select.innerHTML = "";

        proxyLinks.forEach(
            function(link,index){

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    index;

                option.textContent =
                    "Link " +
                    (index + 1);

                select.appendChild(
                    option
                );

            }
        );


        status.textContent =
            proxyLinks.length +
            " links available";


        selectLink();

    }
    catch(error){

        status.textContent =
            "Unable to load proxy database.";

        console.error(error);

    }

}


/*
==========================================================
SELECT LINK
==========================================================
*/

function selectLink(){

    const index =
        Number(select.value);

    if(
        Number.isNaN(index) ||
        !proxyLinks[index]
    ){

        return;

    }

    currentLink =
        proxyLinks[index];

    frame.src =
        currentLink;

}


select.addEventListener(
    "change",
    selectLink
);


/*
==========================================================
ABOUT:BLANK OPENER
==========================================================
*/

document
    .getElementById("openBlank")
    .addEventListener(
        "click",
        function(){

            if(!currentLink){

                alert(
                    "Select a proxy first."
                );

                return;

            }


            /*
            Open a new blank tab immediately
            from the user's click.
            */

            const win =
                window.open(
                    "about:blank",
                    "_blank"
                );


            if(!win){

                alert(
                    "Please allow popups for Voidware."
                );

                return;

            }


            /*
            Escape the selected URL safely
            before inserting it into the new page.
            */

            const safeURL =
                JSON.stringify(
                    currentLink
                );


            /*
            Build the About:Blank page.
            */

            win.document.open();

            win.document.write(
                \`
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Voidware Proxy</title>

<style>

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

}

#proxyEmbed{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    border:0;

    background:#000;

}

</style>

</head>

<body>

<iframe
    id="proxyEmbed"
    allow="accelerometer *; autoplay *; clipboard-read *; clipboard-write *; encrypted-media *; fullscreen *; geolocation *; gyroscope *; microphone *; camera *; midi *; payment *; picture-in-picture *; screen-wake-lock *; sync-xhr *; web-share *"
    allowfullscreen>
</iframe>

<script>

const iframe =
    document.getElementById(
        "proxyEmbed"
    );

iframe.src =
    \${safeURL};

<\\\\/script>

</body>

</html>
                \`
            );

            win.document.close();

        }
    );


/*
==========================================================
FULLSCREEN
==========================================================
*/

document
    .getElementById("fullscreen")
    .addEventListener(
        "click",
        function(){

            if(
                frame.requestFullscreen
            ){

                frame
                    .requestFullscreen()
                    .catch(
                        function(){}
                    );

            }

        }
    );


/*
==========================================================
START
==========================================================
*/

loadDatabase();

`);

    /*
    IMPORTANT:
    Prevent the generated script from being
    prematurely closed.
    */

    lines.push(
        "<" + "/script>"
    );

    lines.push("</body>");
    lines.push("</html>");

    return lines.join("\n");

}


/*
==========================================================
HELPER FUNCTIONS
==========================================================
*/

function getFileNameFromPath(path) {

    return path
        .split("/")
        .pop();

}


function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
==========================================================
GENERATE BUTTON
==========================================================
*/

function generatePage() {

    const pageNameInput =
        document.getElementById(
            "pageName"
        );

    const fileInput =
        document.getElementById(
            "fileName"
        );


    const pageName =
        pageNameInput.value.trim() ||
        "Voidware Proxys";


    let file =
        fileInput.value.trim() ||
        "example.txt";


    if(
        !file
            .toLowerCase()
            .endsWith(".txt")
    ){

        file += ".txt";

    }


    fileInput.value =
        file;

    updatePath();


    /*
    Every TXT file is located at:

    /voidware/proxys/database/
    */

    const databasePath =
        "/voidware/proxys/database/" +
        file;


    const generated =
        buildGeneratedHTML(
            pageName,
            databasePath
        );


    document
        .getElementById(
            "generatedCode"
        )
        .value =
        generated;


    document
        .getElementById(
            "status"
        )
        .textContent =
        "HTML page generated for " +
        file;

}


/*
==========================================================
COPY
==========================================================
*/

async function copyCode() {

    const textarea =
        document.getElementById(
            "generatedCode"
        );


    if(!textarea.value){

        document
            .getElementById(
                "status"
            )
            .textContent =
            "Generate the page first.";

        return;

    }


    try{

        await navigator.clipboard.writeText(
            textarea.value
        );

        document
            .getElementById(
                "status"
            )
            .textContent =
            "Code copied!";

    }
    catch(error){

        textarea.select();

        document.execCommand(
            "copy"
        );

        document
            .getElementById(
                "status"
            )
            .textContent =
            "Code copied!";

    }

}


/*
==========================================================
EVENTS
==========================================================
*/

document
    .getElementById(
        "fileName"
    )
    .addEventListener(
        "input",
        updatePath
    );


document
    .getElementById(
        "loadButton"
    )
    .addEventListener(
        "click",
        loadLinks
    );


document
    .getElementById(
        "generateButton"
    )
    .addEventListener(
        "click",
        generatePage
    );


document
    .getElementById(
        "copyButton"
    )
    .addEventListener(
        "click",
        copyCode
    );


updatePath();

</script>

</body>
