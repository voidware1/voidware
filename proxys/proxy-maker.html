<script>

/* ==========================================================
   REPOSITORY
========================================================== */

const GITHUB_API_BASE =
    "https://api.github.com/repos/voidware1/voidware/contents/proxys/database/";

const RAW_BASE =
    "https://raw.githubusercontent.com/voidware1/voidware/main/proxys/database/";

let loadedLinks = [];


/* ==========================================================
   UPDATE PATH
========================================================== */

function updatePath() {

    let file =
        document
            .getElementById("fileName")
            .value
            .trim();

    if (!file) {

        file =
            "example.txt";

    }

    if (
        !file
            .toLowerCase()
            .endsWith(".txt")
    ) {

        file += ".txt";

    }

    document
        .getElementById("pathBox")
        .textContent =
        "/voidware/proxys/database/" +
        file;

}


/* ==========================================================
   LOAD DATABASE
========================================================== */

async function loadLinks() {

    const input =
        document.getElementById(
            "fileName"
        );

    const status =
        document.getElementById(
            "status"
        );

    const warning =
        document.getElementById(
            "warning"
        );

    const preview =
        document.getElementById(
            "preview"
        );

    let file =
        input.value.trim();


    if (!file) {

        file =
            "example.txt";

    }


    if (
        !file
            .toLowerCase()
            .endsWith(".txt")
    ) {

        file += ".txt";

    }


    input.value =
        file;


    updatePath();


    status.textContent =
        "Loading database...";


    warning.style.display =
        "none";


    preview.innerHTML =
        '<div class="empty">Loading...</div>';


    try {

        /*
        ------------------------------------------------------
        GET FILE FROM GITHUB
        ------------------------------------------------------
        */

        const apiURL =
            GITHUB_API_BASE +
            encodeURIComponent(file);


        const response =
            await fetch(
                apiURL,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "GitHub returned HTTP " +
                response.status
            );

        }


        const fileData =
            await response.json();


        if (!fileData.content) {

            throw new Error(
                "The TXT file did not contain readable content."
            );

        }


        /*
        ------------------------------------------------------
        DECODE BASE64
        ------------------------------------------------------
        */

        const cleanBase64 =
            fileData.content
                .replace(/\s/g, "");


        const binary =
            atob(cleanBase64);


        const bytes =
            new Uint8Array(
                binary.length
            );


        for (
            let i = 0;
            i < binary.length;
            i++
        ) {

            bytes[i] =
                binary.charCodeAt(i);

        }


        const text =
            new TextDecoder(
                "utf-8"
            ).decode(bytes);


        /*
        ------------------------------------------------------
        FIND LINKS
        ------------------------------------------------------
        */

        loadedLinks =
            text
                .split(/\r?\n/)
                .map(function(line) {

                    return line.trim();

                })
                .filter(function(line) {

                    return (
                        line &&
                        !line.startsWith("#") &&
                        /^https?:\/\//i.test(line)
                    );

                });


        /*
        ------------------------------------------------------
        PREVIEW
        ------------------------------------------------------
        */

        renderPreview();


        /*
        ------------------------------------------------------
        AUTOMATICALLY GENERATE HTML
        ------------------------------------------------------
        */

        const pageName =
            document
                .getElementById(
                    "pageName"
                )
                .value
                .trim() ||
            "Voidware Proxys";


        const databasePath =
            "/voidware/proxys/database/" +
            file;


        const generated =
            buildGeneratedHTML(
                pageName,
                databasePath
            );


        /*
        Put HTML into textarea
        */

        const generatedCode =
            document.getElementById(
                "generatedCode"
            );


        generatedCode.value =
            generated;


        /*
        ------------------------------------------------------
        AUTOMATICALLY COPY
        ------------------------------------------------------
        */

        let copied =
            false;


        try {

            await navigator
                .clipboard
                .writeText(
                    generated
                );

            copied = true;

        }
        catch (clipboardError) {

            /*
            Fallback for browsers where
            Clipboard API is unavailable.
            */

            try {

                generatedCode.focus();

                generatedCode.select();

                copied =
                    document.execCommand(
                        "copy"
                    );

            }
            catch (fallbackError) {

                copied = false;

            }

        }


        /*
        ------------------------------------------------------
        STATUS
        ------------------------------------------------------
        */

        if (copied) {

            status.textContent =
                "Loaded " +
                loadedLinks.length +
                " link(s) • HTML generated and copied to clipboard!";

        }
        else {

            status.textContent =
                "Loaded " +
                loadedLinks.length +
                " link(s) • HTML generated. Clipboard access was blocked.";

        }


        /*
        ------------------------------------------------------
        EMPTY DATABASE
        ------------------------------------------------------
        */

        if (
            loadedLinks.length === 0
        ) {

            warning.style.display =
                "block";

            warning.textContent =
                "The TXT file exists, but no valid http:// or https:// links were found.";

        }

    }
    catch (error) {

        loadedLinks = [];


        preview.innerHTML =
            '<div class="empty">Unable to load the database.</div>';


        status.textContent =
            "Error: " +
            error.message;


        warning.style.display =
            "block";


        warning.textContent =
            "Make sure the TXT file exists in proxys/database/ and that the filename is correct.";


        console.error(
            error
        );

    }

}


/* ==========================================================
   PREVIEW
========================================================== */

function renderPreview() {

    const preview =
        document.getElementById(
            "preview"
        );


    if (
        loadedLinks.length === 0
    ) {

        preview.innerHTML =
            '<div class="empty">No links found.</div>';

        return;

    }


    preview.innerHTML =
        "";


    loadedLinks.forEach(
        function(link, index) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "proxy-card";


            const title =
                document.createElement(
                    "h3"
                );


            title.textContent =
                "Proxy " +
                (index + 1);


            const url =
                document.createElement(
                    "p"
                );


            url.textContent =
                link;


            card.appendChild(
                title
            );


            card.appendChild(
                url
            );


            preview.appendChild(
                card
            );

        }
    );

}


/* ==========================================================
   GENERATE HTML
========================================================== */

function buildGeneratedHTML(
    pageName,
    databasePath
) {

    const fileName =
        getFileNameFromPath(
            databasePath
        );


    const rawDatabaseURL =
        RAW_BASE +
        encodeURIComponent(
            fileName
        );


    /*

    IMPORTANT
    ----------------------------------------------------------
    This uses a template literal to generate the page.

    Backslashes are intentionally escaped here so the
    GENERATED page receives the correct JavaScript regex.
    ----------------------------------------------------------
    */

    const generatedHTML = `<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta

}

}

        1px solid #3b2253;

    border-radius:15px;

    padding:20px;
}

select{
    width:100%;

    padding:13px;

    border-radius:9px;

    border:
        1px solid #493060;

    background:#0d0815;

    color:white;

    font-size:15px;

    outline:none;

    margin-bottom:12px;
}

    border-color:#a855f7;
}

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-bottom:15px;
}

    border:0;

    border-radius:9px;

    padding:11px 16px;

    background:#7c3aed;

    color:white;

    font-weight:bold;

    cursor:pointer;
}

    background:#9333ea;
}

    height:600px;

    border:
        1px solid #493060;

    border-radius:10px;

<script>

const DATABASE_URL =
    ${JSON.stringify(rawDatabaseURL)};


let proxyLinks = [];

let currentLink = "";


const select =
    document.getElementById(
        "linkSelect"
    );


const frame =
    document.getElementById(
        "proxyFrame"
    );


const status =
    document.getElementById(
        "status"
    );


/* ==========================================================
   LOAD DATABASE
========================================================== */

async function loadDatabase(){

    try{

        const response =
            await fetch(
                DATABASE_URL,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        proxyLinks =
            text
                .split(/\\r?\\n/)
                .map(function(line){

                    return line.trim();

                })
                .filter(function(line){

                    return (
                        line &&
                        !line.startsWith("#") &&
                        /^https?:\\/\\//i.test(line)
                    );

                });


        if(
            proxyLinks.length === 0
        ){

            status.textContent =
                "No links found.";

            return;

        }


        select.innerHTML =
            "";


        proxyLinks.forEach(
            function(link,index){

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    index;


                option.textContent =
                    "Link " +
                    (index + 1);


                select.appendChild(
                    option
                );

            }
        );


        status.textContent =
            proxyLinks.length +
            " links available";


        selectLink();

    }
    catch(error){

        status.textContent =
            "Unable to load proxy database.";

        console.error(
            error
        );

    }

}


/* ==========================================================
   SELECT LINK
========================================================== */

function selectLink(){

    const index =
        Number(
            select.value
        );


    if(
        Number.isNaN(index) ||
        !proxyLinks[index]
    ){

        return;

    }


    currentLink =
        proxyLinks[index];


    frame.src =
        currentLink;

}


select.addEventListener(
    "change",
    selectLink
);


/* ==========================================================
   ABOUT:BLANK
========================================================== */

document
    .getElementById(
        "openBlank"
    )
    .addEventListener(
        "click",
        function(){

            if(!currentLink){

                alert(
                    "Select a proxy first."
                );

                return;

            }


            const win =
                window.open(
                    "about:blank",
                    "_blank"
                );


            if(!win){

                alert(
                    "Please allow popups for Voidware."
                );

                return;

            }


            /*
            Create a blank page and put the
            selected proxy inside an iframe.
            */

            win.document.open();


            win.document.write(
                '<!DOCTYPE html>' +

                '<html lang="en">' +

                '<head>' +

                '<meta charset="UTF-8">' +

                '<meta name="viewport" content="width=device-width,initial-scale=1.0">' +

                '<title>Voidware Proxy</title>' +

                '<style>' +

                'html,body{' +
                    'margin:0;' +
                    'padding:0;' +
                    'width:100%;' +
                    'height:100%;' +
                    'overflow:hidden;' +
                    'background:#000;' +
                '}' +

                '#proxyEmbed{' +
                    'position:fixed;' +
                    'inset:0;' +
                    'width:100%;' +
                    'height:100%;' +
                    'border:0;' +
                    'background:#000;' +
                '}' +

                '</style>' +

                '</head>' +

                '<body>' +

                '<iframe ' +
                    'id="proxyEmbed" ' +
                    'allow="accelerometer *; autoplay *; clipboard-read *; clipboard-write *; encrypted-media *; fullscreen *; geolocation *; gyroscope *; microphone *; camera *; midi *; payment *; picture-in-picture *; screen-wake-lock *; sync-xhr *; web-share *" ' +
                    'allowfullscreen>' +
                '</iframe>' +

                '<script>' +

                'document.getElementById("proxyEmbed").src=' +
                JSON.stringify(currentLink) +
                ';' +

                '<\\/script>' +

                '</body>' +

                '</html>'
            );


            win.document.close();

        }
    );


/* ==========================================================
   FULLSCREEN
========================================================== */

document
    .getElementById(
        "fullscreen"
    )
    .addEventListener(
        "click",
        function(){

            if(
                frame.requestFullscreen
            ){

                frame
                    .requestFullscreen()
                    .catch(
                        function(){}
                    );

            }

        }
    );


/* ==========================================================
   START
========================================================== */

loadDatabase();

<\/script>

</body>

</html>`;


    return generatedHTML;

}


/* ==========================================================
   GET FILE NAME
========================================================== */

function getFileNameFromPath(
    path
) {

    return path
        .split("/")
        .pop();

}


/* ==========================================================
   ESCAPE HTML
========================================================== */

function escapeHTML(
    text
) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

   COPY BUTTON
========================================================== */

async function copyCode() {

    const textarea =
        document.getElementById(
            "generatedCode"
        );


    const status =
        document.getElementById(
            "status"
        );


    if(
        !textarea.value
    ){

        status.textContent =
            "Generate the page first.";

        return;

    }


    try{

        await navigator
            .clipboard
            .writeText(
                textarea.value
            );


        status.textContent =
            "Code copied!";

    }
    catch(error){

        textarea.focus();

        textarea.select();


        try {

            document.execCommand(
                "copy"
            );

            status.textContent =
                "Code copied!";

        }
        catch(copyError){

            status.textContent =
                "Clipboard access was blocked.";

        }

    }

}

    .getElementById(
        "fileName"
    )
    .addEventListener(
        "input",
        updatePath
    );


document
    .getElementById(

    )
    .addEventListener(
        "click",
        loadLinks
    );


document
    .getElementById(
        "copyButton"
    )
    .addEventListener(

        copyCode
    );


updatePath();
