  <div class="background">

  <header>

  <main>

    <div class="section-top">

        Loading...
      </div>
    </div>

    <div id="gamesGrid">

      <div class="loading">
        <div class="spinner"></div>
        <div>Loading games...</div>
      </div>

    </div>

  </main>

  <footer>
    VOIDWARE • PLAY • EXPLORE • ENJOY
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    /*
      ============================================
      VOIDWARE GAME AUTO-DISCOVERY
      ============================================

      Change these if your repository changes.
    */

    const GITHUB_USER = "voidware1";
    const GITHUB_REPO = "voidware";
    const GAMES_FOLDER = "games";

    /*
      Your GitHub Pages base URL.
    */

    const SITE_BASE =
      `https://${GITHUB_USER}.github.io/${GITHUB_REPO}`;

    /*
      GitHub API endpoint for the games folder.
    */

    const API_URL =
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GAMES_FOLDER}`;

    const gamesGrid = document.getElementById("gamesGrid");
    const searchInput = document.getElementById("searchInput");
    const gameCount = document.getElementById("gameCount");
    const refreshBtn = document.getElementById("refreshBtn");
    const toast = document.getElementById("toast");

    let games = [];

    /*
      Show a small notification.
    */

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    /*
      Convert a filename into a nice title.

      example:
      blue-lock.html
      ->
      Blue Lock
    */

    function filenameToTitle(filename) {

      return filename
        .replace(/\.html$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());

    }

    /*
      Escape HTML so filenames cannot inject HTML.
    */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

    /*
      Get optional metadata from the game's HTML.

      This lets you customize a game's card without
      changing this index.html.

      Supported:

      <meta name="game-title" content="My Game">
      <meta name="game-description" content="My description">
      <meta name="game-image" content="thumbnail.png">
    */

    async function getGameMetadata(file) {

      const defaultTitle = filenameToTitle(file.name);

      const game = {
        name: defaultTitle,
        description: "Click play to launch this game.",
        image: "",
        url: `${SITE_BASE}/${GAMES_FOLDER}/${encodeURIComponent(file.name)}`
      };

      try {

        const response = await fetch(file.download_url, {
          cache: "no-store"
        });

        if (!response.ok) {
          return game;
        }

        const html = await response.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");

        const title =
          doc.querySelector('meta[name="game-title"]');

        const description =
          doc.querySelector('meta[name="game-description"]');

        const image =
          doc.querySelector('meta[name="game-image"]');

        if (title && title.content.trim()) {
          game.name = title.content.trim();
        }

        if (description && description.content.trim()) {
          game.description = description.content.trim();
        }

        if (image && image.content.trim()) {

          let imageURL = image.content.trim();

          /*
            If the image is relative, make it relative
            to the game's GitHub Pages folder.
          */

          if (
            !imageURL.startsWith("http://") &&
            !imageURL.startsWith("https://") &&
            !imageURL.startsWith("data:")
          ) {

            imageURL =
              `${SITE_BASE}/${GAMES_FOLDER}/${imageURL}`;
          }

          game.image = imageURL;
        }

      } catch (error) {

        console.warn(
          "Could not read metadata for:",
          file.name,
          error
        );

      }

      return game;
    }

    /*
      Load games from GitHub.
    */

    async function loadGames() {

      gamesGrid.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <div>Finding games...</div>
        </div>
      `;

      gameCount.textContent = "Loading...";

      try {

        const response = await fetch(
          API_URL + "?t=" + Date.now(),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {

          throw new Error(
            `GitHub API returned ${response.status}`
          );

        }

        const files = await response.json();

        /*
          Only use HTML files.
        */

        const htmlFiles = files
          .filter(file =>
            file.type === "file" &&
            /\.html$/i.test(file.name)
          )
          .filter(file =>
            file.name.toLowerCase() !== "index.html"
          );

        /*
          Get metadata for every game.
        */

        games = await Promise.all(
          htmlFiles.map(getGameMetadata)
        );

        /*
          Alphabetical sorting.
        */

        games.sort((a, b) =>
          a.name.localeCompare(b.name)
        );

        renderGames();

        showToast(
          `${games.length} game${games.length === 1 ? "" : "s"} found`
        );

      } catch (error) {

        console.error(error);

        games = [];

        gamesGrid.innerHTML = `
          <div class="empty">

            <div class="empty-icon">⚠️</div>

            <h3>Couldn't load games</h3>

            <p>
              Make sure your repository has a
              <strong>/games/</strong> folder.
            </p>

            <p style="margin-top:8px;">
              ${escapeHTML(error.message)}
            </p>

          </div>
        `;

        gameCount.textContent = "Error";
      }
    }

    /*
      Render games based on the current search.
    */

    function renderGames() {

      const query =
        searchInput.value
          .trim()
          .toLowerCase();

      const filteredGames = games.filter(game => {

        return (
          game.name.toLowerCase().includes(query) ||
          game.description.toLowerCase().includes(query)
        );

      });

      gameCount.textContent =
        `${filteredGames.length} ${
          filteredGames.length === 1
            ? "game"
            : "games"
        }`;

      if (filteredGames.length === 0) {

        gamesGrid.innerHTML = `
          <div class="empty">

            <div class="empty-icon">🔍</div>

            <h3>No games found</h3>

            <p>
              Try searching for something else.
            </p>

          </div>
        `;

        return;
      }

      gamesGrid.innerHTML =
        filteredGames
          .map(game => createGameCard(game))
          .join("");

    }

    /*
      Create one game card.
    */

    function createGameCard(game) {

      const icon = game.image

        ? `
          <img
            src="${escapeHTML(game.image)}"
            alt=""
            loading="lazy"
            onerror="this.parentElement.innerHTML='🎮'"
          >
        `

        : "🎮";

      return `

        <article class="game-card">

          <div class="game-icon">
            ${icon}
          </div>

          <div class="game-title">
            ${escapeHTML(game.name)}
          </div>

          <div class="game-description">
            ${escapeHTML(game.description)}
          </div>

          <button
            class="play-btn"
            onclick="playGame('${escapeHTML(game.url)}')"
          >
            ▶ PLAY
          </button>

        </article>

      `;

    }

    /*
      Launch game.
    */

    function playGame(url) {

      window.location.href = url;

    }

    /*
      Search as the user types.
    */

    searchInput.addEventListener(
      "input",
      renderGames
    );

    /*
      Refresh button.
    */

    refreshBtn.addEventListener(
      "click",
      loadGames
    );

    /*
      "/" focuses the search bar.

      Escape clears it.
    */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "/" &&
          document.activeElement !== searchInput
        ) {

          event.preventDefault();

          searchInput.focus();

        }

        if (
          event.key === "Escape" &&
          document.activeElement === searchInput
        ) {

          searchInput.value = "";
          renderGames();
          searchInput.blur();

        }

      }
    );

    /*
      Start.
    */

    loadGames();

  </script>

</body>
</html>
