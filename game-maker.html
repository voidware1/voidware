<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
* {

  margin: 0;

    radial-gradient(
      circle at 50% -10%,
      rgba(125,45,220,.22),
      transparent 42%
    ),
    var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

header {
  position: sticky;
  top: 0;
  z-index: 100;

.field {

label {

/* TOAST */

/* MOBILE */

@media(max-width:600px) {

  .container {

  }

  }

  .preview-frame {
    height: 420px;
  }

  .button-row {

  }

}

<script>
"use strict";

/*
==================================================
VOIDWARE GAME MAKER
==================================================
*/

var mode = "html";
var previewBlobURL = null;


/* ELEMENTS */

var htmlMode =
  document.getElementById("htmlMode");

var urlMode =
  document.getElementById("urlMode");

var htmlArea =
  document.getElementById("htmlArea");

var urlArea =
  document.getElementById("urlArea");

var gameTitle =
  document.getElementById("gameTitle");

var gameIcon =
  document.getElementById("gameIcon");

var iconPreview =
  document.getElementById("iconPreview");

var htmlInput =
  document.getElementById("htmlInput");

var gameURL =
  document.getElementById("gameURL");

var generateButton =
  document.getElementById("generateButton");

var clearButton =
  document.getElementById("clearButton");

var copyButton =
  document.getElementById("copyButton");

var generatedCode =
  document.getElementById("generatedCode");

var previewFrame =
  document.getElementById("previewFrame");

var status =
  document.getElementById("status");

var backButton =
  document.getElementById("backButton");

var toast =
  document.getElementById("toast");


/* TOAST */

var toastTimer;

function showToast(message) {

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(
    function() {

      toast.classList.remove("show");

    },
    2500
  );

}


/* MODE */

function setMode(newMode) {

  mode = newMode;

  if (mode === "html") {

    htmlMode.classList.add("active");
    urlMode.classList.remove("active");

    htmlArea.classList.remove("hidden");
    urlArea.classList.add("hidden");

  } else {

    urlMode.classList.add("active");
    htmlMode.classList.remove("active");

    urlArea.classList.remove("hidden");
    htmlArea.classList.add("hidden");

  }

}


/* ICON */

gameIcon.addEventListener(
  "input",
  function() {

    iconPreview.textContent =
      gameIcon.value || "🎮";

  }
);


/*
==================================================
ESCAPE TEXT
==================================================
*/

function escapeHTML(value) {

  var div =
    document.createElement("div");

  div.textContent = value;

  return div.innerHTML;

}


/*
==================================================
CREATE PLAYER
==================================================
*/

function createPlayer(source, isHTML) {

  var iframe =
    document.createElement("iframe");

  iframe.id = "gameFrame";

  iframe.setAttribute(
    "allowfullscreen",
    ""
  );

  iframe.setAttribute(
    "allow",
    "accelerometer; autoplay; clipboard-read; clipboard-write; encrypted-media; fullscreen; gamepad; gyroscope; microphone; camera; midi; payment; picture-in-picture; screen-wake-lock; web-share"
  );


  if (isHTML) {

    iframe.srcdoc =
      source;

  } else {

    iframe.src =
      source;

  }


  /*
  Get exactly what the browser would
  serialize for the generated page.
  */

  var wrapper =
    document.createElement("div");

  wrapper.appendChild(
    iframe
  );

  return wrapper.innerHTML;

}


/*
==================================================
GENERATE PAGE
==================================================
*/

function generateGamePage() {

  var title =
    gameTitle.value.trim() ||
    "Voidware Game";

  var icon =
    gameIcon.value.trim() ||
    "🎮";


  var player;


  if (mode === "html") {

    var source =
      htmlInput.value;


    if (!source.trim()) {

      showToast(
        "Paste the UGS HTML first."
      );

      return;

    }


    player =
      createPlayer(
        source,
        true
      );


    /*
    Preview the UGS HTML directly.
    */

    if (previewBlobURL) {

      URL.revokeObjectURL(
        previewBlobURL
      );

    }


    var blob =
      new Blob(
        [source],
        {
          type:
            "text/html"
        }
      );


    previewBlobURL =
      URL.createObjectURL(
        blob
      );


    previewFrame.src =
      previewBlobURL;

  }


  else {

    var url =
      gameURL.value.trim();


    if (!url) {

      showToast(
        "Enter a game URL first."
      );

      return;

    }


    try {

      new URL(url);

    }

    catch {

      showToast(
        "Enter a valid URL."
      );

      return;

    }


    player =
      createPlayer(
        url,
        false
      );


    previewFrame.src =
      url;

  }


  /*
  BUILD THE GENERATED PAGE
  */

  var lines = [];


  lines.push(
    "<!DOCTYPE html>"
  );

  lines.push(
    '<html lang="en">'
  );

  lines.push(
    "<head>"
  );

  lines.push(
    '<meta charset="UTF-8">'
  );

  lines.push(
    '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
  );

  lines.push(
    "<title>" +
    escapeHTML(title) +
    " — Voidware</title>"
  );

  lines.push(
    '<meta name="game-title" content="' +
    escapeHTML(title) +
    '">'
  );

  lines.push(
    '<meta name="theme-color" content="#080510">'
  );


  /* CSS */

  lines.push("<style>");

  lines.push(
    "*{box-sizing:border-box;margin:0;padding:0;}"
  );

  lines.push(
    "html,body{width:100%;height:100%;}"
  );

  lines.push(
    "body{background:#07050c;color:#f5f0ff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;}"
  );

  lines.push(
    "header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:rgba(7,5,12,.94);border-bottom:1px solid rgba(155,77,255,.2);}"
  );

  lines.push(
    ".logo{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:2px;}"
  );

  lines.push(
    ".logo-icon{width:31px;height:31px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(135deg,#9b4dff,#5f20b8);}"
  );

  lines.push(
    ".game-name{color:#cfc4db;font-size:13px;max-width:30vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}"
  );

  lines.push(
    ".controls{display:flex;gap:7px;}"
  );

  lines.push(
    ".control{border:1px solid rgba(155,77,255,.25);background:rgba(255,255,255,.04);color:#ddd3ea;padding:7px 10px;border-radius:8px;cursor:pointer;}"
  );

  lines.push(
    ".control:hover{border-color:rgba(155,77,255,.7);color:white;}"
  );

  lines.push(
    "#gameContainer{position:absolute;top:58px;left:0;right:0;bottom:0;background:#000;}"
  );

  lines.push(
    "#gameFrame{width:100%;height:100%;border:0;display:block;}"
  );

  lines.push(
    "@media(max-width:650px){.game-name{display:none;}.control{padding:6px 7px;font-size:11px;}}"
  );

  lines.push(
    "</style>"
  );

  lines.push(
    "</head>"
  );

  lines.push(
    "<body>"
  );


  /* HEADER */

  lines.push(
    '<header>'
  );

  lines.push(
    '<div class="logo">'
  );

  lines.push(
    '<div class="logo-icon">' +
    escapeHTML(icon) +
    "</div>"
  );

  lines.push(
    '<div class="game-name">' +
    escapeHTML(title) +
    "</div>"
  );

  lines.push(
    "</div>"
  );


  lines.push(
    '<div class="controls">'
  );

  lines.push(
    '<button class="control" id="fullscreenButton" type="button">⛶ Fullscreen</button>'
  );

  lines.push(
    '<button class="control" id="blankButton" type="button">↗ About:blank</button>'
  );

  lines.push(
    '<button class="control" id="libraryButton" type="button">← Library</button>'
  );

  lines.push(
    "</div>"
  );

  lines.push(
    "</header>"
  );


  /* GAME */

  lines.push(
    '<main id="gameContainer">'
  );

  lines.push(
    player
  );

  lines.push(
    "</main>"
  );


  /*
  SCRIPT

  We deliberately construct the script tag
  using two strings so the Game Maker itself
  cannot accidentally close its own script.
  */

  lines.push(
    "<scr" + "ipt>"
  );

  lines.push(
    'var frame=document.getElementById("gameFrame");'
  );

  lines.push(
    'document.getElementById("fullscreenButton").addEventListener("click",function(){if(frame.requestFullscreen){frame.requestFullscreen();}});'
  );

  lines.push(
    'document.getElementById("blankButton").addEventListener("click",function(){var w=window.open("about:blank","_blank");if(!w){alert("Please allow popups for Voidware.");return;}w.document.open();w.document.write(document.documentElement.outerHTML);w.document.close();});'
  );

  lines.push(
    'document.getElementById("libraryButton").addEventListener("click",function(){window.location.href="index.html";});'
  );

  lines.push(
    "</scr" + "ipt>"
  );


  lines.push(
    "</body>"
  );

  lines.push(
    "</html>"
  );


  var finalPage =
    lines.join("\n");


  generatedCode.value =
    finalPage;


  status.textContent =
    "Generated ✓";

  showToast(
    "Game page generated!"
  );

}


/*
==================================================
COPY
==================================================
*/

async function copyCode() {

  var code =
    generatedCode.value;


  if (!code) {

    showToast(
      "Generate a page first."
    );

    return;

  }


  try {

    await navigator.clipboard.writeText(
      code
    );

    showToast(
      "HTML copied!"
    );

  }

  catch {

    generatedCode.focus();

    generatedCode.select();

    document.execCommand(
      "copy"
    );

    showToast(
      "HTML copied!"
    );

  }

}


/*
==================================================
CLEAR
==================================================
*/

function clearAll() {

  gameTitle.value =
    "";

  gameIcon.value =
    "🎮";

  htmlInput.value =
    "";

  gameURL.value =
    "";

  generatedCode.value =
    "";

  iconPreview.textContent =
    "🎮";

  previewFrame.src =
    "about:blank";

  status.textContent =
    "Ready";


  if (previewBlobURL) {

    URL.revokeObjectURL(
      previewBlobURL
    );

    previewBlobURL =
      null;

  }

  showToast(
    "Cleared!"
  );

}


/*
==================================================
EVENTS
==================================================
*/

htmlMode.addEventListener(
  "click",
  function() {

    setMode("html");

  }
);

urlMode.addEventListener(
  "click",
  function() {

    setMode("url");

  }
);

generateButton.addEventListener(
  "click",
  generateGamePage
);

copyButton.addEventListener(
  "click",
  copyCode
);

clearButton.addEventListener(
  "click",
  clearAll
);

backButton.addEventListener(
  "click",
  function() {

    window.location.href =
      "index.html";

  }
);


window.addEventListener(
